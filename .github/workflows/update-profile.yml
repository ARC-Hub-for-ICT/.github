name: Update profile projects

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh project section
        run: python3 scripts/update_profile.py
      - name: Commit updated profile
        run: |
          if git diff --quiet -- profile/README.md; then
            echo "No project changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/README.md
          git commit -m "Update profile projects"
          git push origin "HEAD:${{ github.ref_name }}"
